<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="t d">
  <title id="t">What's in the box</title>
  <desc id="d">The ClaudeAgent core (registerTool, execute, retries, TypeScript, Anthropic SDK), three example tools (calculator, file-operations, web-search), and two multi-step workflows (code-review, data-analysis).</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes g0 { 0%,4.00% { opacity:0; transform:translateY(10px); } 8.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g0 { animation:g0 10.0s infinite; }
    @keyframes g1 { 0%,10.00% { opacity:0; transform:translateY(10px); } 14.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g1 { animation:g1 10.0s infinite; }
    @keyframes g2 { 0%,13.00% { opacity:0; transform:translateY(10px); } 17.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g2 { animation:g2 10.0s infinite; }
    @keyframes g3 { 0%,16.00% { opacity:0; transform:translateY(10px); } 20.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g3 { animation:g3 10.0s infinite; }
    @keyframes g4 { 0%,20.00% { opacity:0; transform:translateY(10px); } 24.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g4 { animation:g4 10.0s infinite; }
    @keyframes g5 { 0%,23.00% { opacity:0; transform:translateY(10px); } 27.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g5 { animation:g5 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="410" rx="20" fill="#0f1420"/>
  <text x="40" y="54" font-size="27" font-weight="800">What's in the box</text>
  <text x="40" y="80" font-size="14" class="muted">An agent core, example tools to register, and ready-made multi-step workflows.</text>
  <text x="40" y="118" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">CORE</text>
  <text x="350" y="118" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">TOOLS</text>
  <text x="640" y="118" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">WORKFLOWS</text>
  <g class="g0"><rect x="40" y="130" width="280" height="250" rx="14" fill="#211a33" fill-opacity=".5" stroke="#b58cff" stroke-width="2"/><text x="60" y="162" font-size="17" font-weight="800">ClaudeAgent</text><text x="60" y="184" font-size="12" class="muted">the core you build on</text><text x="60" y="222" font-size="13" class="mono" style="fill:#d9c6ff">registerTool()</text><text x="60" y="250" font-size="13" class="mono" style="fill:#d9c6ff">execute(prompt)</text><text x="60" y="278" font-size="13" class="mono" style="fill:#d9c6ff">run a workflow</text><text x="60" y="318" font-size="11.5" class="muted">error handling + retries</text><text x="60" y="338" font-size="11.5" class="muted">TypeScript · Anthropic SDK</text><text x="60" y="358" font-size="11.5" class="muted">powered by Claude</text></g><g class="g1"><rect x="350" y="130" width="260" height="72" rx="12" fill="#ffb02e" fill-opacity=".08" stroke="#ffb02e" stroke-opacity=".55"/><text x="368" y="160" font-size="14" font-weight="700" class="mono" style="fill:#ffb02e">calculator</text><text x="368" y="182" font-size="11.5" class="muted">arithmetic</text><text x="592" y="160" text-anchor="end" font-size="10" class="muted">TOOL</text></g><g class="g2"><rect x="350" y="214" width="260" height="72" rx="12" fill="#3ec7ff" fill-opacity=".08" stroke="#3ec7ff" stroke-opacity=".55"/><text x="368" y="244" font-size="14" font-weight="700" class="mono" style="fill:#3ec7ff">file-operations</text><text x="368" y="266" font-size="11.5" class="muted">read / write files</text><text x="592" y="244" text-anchor="end" font-size="10" class="muted">TOOL</text></g><g class="g3"><rect x="350" y="298" width="260" height="72" rx="12" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".55"/><text x="368" y="328" font-size="14" font-weight="700" class="mono" style="fill:#3ddc84">web-search</text><text x="368" y="350" font-size="11.5" class="muted">look things up</text><text x="592" y="328" text-anchor="end" font-size="10" class="muted">TOOL</text></g><g class="g4"><rect x="640" y="130" width="280" height="114" rx="12" fill="#ff5c8a" fill-opacity=".08" stroke="#ff5c8a" stroke-opacity=".55"/><text x="660" y="162" font-size="14" font-weight="700" class="mono" style="fill:#ff5c8a">code-review</text><text x="660" y="186" font-size="12" class="muted">review a diff end-to-end</text><text x="660" y="216" font-size="10.5" class="muted">a multi-step workflow</text><text x="900" y="162" text-anchor="end" font-size="10" class="muted">WORKFLOW</text></g><g class="g5"><rect x="640" y="256" width="280" height="114" rx="12" fill="#20b8cd" fill-opacity=".08" stroke="#20b8cd" stroke-opacity=".55"/><text x="660" y="288" font-size="14" font-weight="700" class="mono" style="fill:#20b8cd">data-analysis</text><text x="660" y="312" font-size="12" class="muted">multi-step analysis</text><text x="660" y="342" font-size="10.5" class="muted">a multi-step workflow</text><text x="900" y="288" text-anchor="end" font-size="10" class="muted">WORKFLOW</text></g>
</svg>
