<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">The agent loop: reason, act, observe, answer</title>
  <desc id="d">You ask the agent what 157 times 23 is. Claude reasons, decides to call the calculator tool, reads the result 3611, and answers 3,611. A TypeScript framework for building Claude agents with tools.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#d97757"/><stop offset=".5" stop-color="#b58cff"/><stop offset="1" stop-color="#3ec7ff"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes ask { 0%,2.73% { opacity:0; transform:translateY(8px); } 6.36%,94.55% { opacity:1; transform:translateY(0); } 97.27%,100% { opacity:0 } } .ask { animation:ask 11.0s infinite; }
    @keyframes reason { 0%,16.36% { opacity:0; } 20.00%,94.55% { opacity:1; } 97.27%,100% { opacity:0 } } .reason { animation:reason 11.0s infinite; }
    @keyframes tool { 0%,30.91% { opacity:0; } 34.55%,94.55% { opacity:1; } 97.27%,100% { opacity:0 } } .tool { animation:tool 11.0s infinite; }
    @keyframes obs { 0%,45.45% { opacity:0; } 49.09%,94.55% { opacity:1; } 97.27%,100% { opacity:0 } } .obs { animation:obs 11.0s infinite; }
    @keyframes ans { 0%,63.64% { opacity:0; transform:translateY(8px); } 67.27%,94.55% { opacity:1; transform:translateY(0); } 97.27%,100% { opacity:0 } } .ans { animation:ans 11.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="420" rx="20" fill="#0f1420"/>
  <text x="40" y="58" font-size="36" font-weight="800" style="fill:url(#title)">Your first Claude agent</text>
  <text x="42" y="88" font-size="16" class="muted">Give Claude tools, and it works the problem: reason → act → observe → answer.</text>

  <!-- prompt -->
  <g class="ask"><rect x="40" y="180" width="250" height="56" rx="14" fill="#2a3550"/><text x="56" y="205" font-size="14">"What is 157 × 23?"</text><text x="56" y="226" font-size="11" class="muted">you</text></g>

  <!-- loop -->
  <circle cx="610" cy="250" r="110" fill="none" stroke="#2c3750" stroke-width="2" stroke-dasharray="4 6"/>
  <g class="reason"><rect x="500" y="146" width="150" height="44" rx="10" fill="#211a33" stroke="#b58cff"/><text x="575" y="166" text-anchor="middle" font-size="12.5" font-weight="700">Claude reasons</text><text x="575" y="182" text-anchor="middle" font-size="10" class="muted">"I'll use the calculator"</text></g>
  <g class="tool"><rect x="690" y="228" width="160" height="44" rx="10" fill="#2a2510" stroke="#ffb02e"/><text x="770" y="248" text-anchor="middle" font-size="12.5" font-weight="700">calls a tool</text><text x="770" y="264" text-anchor="middle" font-size="10" class="mono muted">calculator(157,23)</text></g>
  <g class="obs"><rect x="500" y="310" width="150" height="44" rx="10" fill="#0d1d2b" stroke="#3ec7ff"/><text x="575" y="330" text-anchor="middle" font-size="12.5" font-weight="700">reads result</text><text x="575" y="346" text-anchor="middle" font-size="10" class="mono muted">→ 3611</text></g>

  <!-- answer -->
  <g class="ans"><rect x="40" y="300" width="300" height="70" rx="14" fill="#132a1e" stroke="#3ddc84"/><text x="56" y="328" font-size="14" style="fill:#9ff0c4">"157 × 23 = 3,611."</text><text x="56" y="350" font-size="11" class="muted">agent, after one tool call</text></g>
  <path d="M290 208 C 380 208, 420 180, 500 168" fill="none" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <path d="M500 335 C 420 345, 380 345, 340 340" fill="none" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
</svg>
